name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, typecheck, build, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Third-party action pinned by commit (v6.1.0); pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Cache the mongod binary used by mongodb-memory-server
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongod-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm audit --prod

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate compose configuration
        run: docker compose config
      - name: Build the development compose target
        run: docker compose build api
      - name: Start the local stack
        run: docker compose up -d
      - name: Check liveness
        run: curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:1500/health
      - name: Stop the local stack
        if: always()
        run: docker compose down -v --remove-orphans
