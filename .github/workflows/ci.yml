name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, typecheck, build, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # pnpm version comes from package.json#packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Cache the mongod binary used by mongodb-memory-server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongod-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm audit --prod

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download and verify actionlint (v1.7.12)
        run: |
          set -euo pipefail
          VERSION=1.7.12
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          URL="https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          EXPECTED_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

          curl --fail --silent --show-error --location "$URL" --output "$ARCHIVE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --status || {
            echo "::error::SHA-256 verification failed for ${ARCHIVE}"
            exit 1
          }

          tar --extract --gzip --file "$ARCHIVE" actionlint
          chmod +x actionlint
          echo "$PWD" >> "$GITHUB_PATH"
        shell: bash
      - name: Check workflow files
        run: actionlint -color
        shell: bash

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --target runtime --tag backed-rest-server-js:ci .
      - name: Validate compose configuration
        run: docker compose config
      - name: Build the development compose target
        run: docker compose build api
      - name: Start the local stack
        run: docker compose up -d
      - name: Check liveness
        # The published port accepts and resets connections until the app listens: retry every error.
        run: curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:1500/health
      - name: Show the api logs
        if: failure()
        run: docker compose logs api
      - name: Stop the local stack
        if: always()
        run: docker compose down -v --remove-orphans
