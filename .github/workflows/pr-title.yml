name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Third-party action pinned by commit (v6.1.1).
      - uses: amannn/action-semantic-pull-request@48f2562
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            build
            perf
